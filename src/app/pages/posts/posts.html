<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#"><i class="bi bi-chat-square-text-fill me-2"></i>SHD Feed Social</a>
    <div class="d-flex align-items-center">
      <span class="text-light me-3"><i class="bi bi-person-circle me-1"></i> {{ currentUser }}</span>
      <button class="btn btn-outline-light btn-sm" (click)="logout()">
        <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
      </button>
    </div>
  </div>
</nav>

<div class="container py-4" style="max-width: 700px;">
  <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show" role="alert">
    {{ errorMessage }}
    <button type="button" class="btn-close" (click)="errorMessage = ''"></button>
  </div>
  <div *ngIf="successMessage" class="alert alert-success alert-dismissible fade show" role="alert">
    {{ successMessage }}
    <button type="button" class="btn-close" (click)="successMessage = ''"></button>
  </div>

  <!-- Crear Post Card -->
  <div class="card shadow-sm mb-4 border-0 rounded-4">
    <div class="card-body p-4">
      <h5 class="card-title fw-bold text-primary mb-3"><i class="bi bi-pencil-square me-2"></i>Crear Nueva Publicación</h5>
      <form (ngSubmit)="createPost()">
        <div class="mb-3">
          <input 
            type="text" 
            class="form-control border-0 bg-light" 
            [(ngModel)]="newPost.title" 
            name="title" 
            placeholder="Título de tu publicación..." 
            required>
        </div>
        <div class="mb-3">
          <textarea 
            class="form-control border-0 bg-light" 
            rows="3" 
            [(ngModel)]="newPost.body" 
            name="body" 
            placeholder="¿Qué estás pensando?" 
            required></textarea>
        </div>
        <div class="d-flex justify-content-end">
          <button type="submit" class="btn btn-primary px-4 rounded-pill fw-bold" [disabled]="submitting">
            <span *ngIf="submitting" class="spinner-border spinner-border-sm me-2"></span>
            Publicar
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Muro / Feed -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold text-dark m-0">Muro Principal</h4>
    <button class="btn btn-sm btn-outline-secondary" (click)="loadPosts()">
      <i class="bi bi-arrow-clockwise"></i> Actualizar
    </button>
  </div>

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <div *ngFor="let post of posts" class="card shadow-sm mb-3 border-0 rounded-4">
    <div class="card-body p-4">
      
      <!-- Visualización normal -->
      <div *ngIf="editingPostId !== post.id">
        <div class="d-flex justify-content-between align-items-start mb-2">
          <div class="d-flex align-items-center">
            <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-2 fw-bold" style="width: 40px; height: 40px;">
              {{ post.userId || 1 }}
            </div>
            <div>
              <h6 class="fw-bold mb-0 text-dark">Usuario #{{ post.userId || 1 }}</h6>
              <small class="text-muted">Post ID: {{ post.id }}</small>
            </div>
          </div>
          <div>
            <button class="btn btn-sm btn-light text-primary me-1" (click)="startEdit(post)">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-sm btn-light text-danger" (click)="deletePost(post.id)">
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </div>

        <h5 class="fw-bold text-primary mt-3">{{ post.title }}</h5>
        <p class="text-secondary mb-3">{{ post.body }}</p>
      </div>

      <!-- Edición -->
      <div *ngIf="editingPostId === post.id">
        <h6 class="fw-bold text-warning mb-3"><i class="bi bi-pencil-fill me-1"></i> Editando Publicación</h6>
        <div class="mb-2">
          <input type="text" class="form-control" [(ngModel)]="editedPost.title" name="editTitle">
        </div>
        <div class="mb-3">
          <textarea class="form-control" rows="3" [(ngModel)]="editedPost.body" name="editBody"></textarea>
        </div>
        <div class="d-flex justify-content-end gap-2">
          <button class="btn btn-sm btn-secondary" (click)="cancelEdit()">Cancelar</button>
          <button class="btn btn-sm btn-success fw-bold" (click)="updatePost(post.id!)">Guardar</button>
        </div>
      </div>

    </div>
  </div>
</div>
